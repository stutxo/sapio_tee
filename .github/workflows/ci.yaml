name: Locked Rust and Nitro image build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check production and local development contracts
        run: |
          nix develop --no-update-lock-file -c cargo check --locked --all-targets --no-default-features
          nix develop --no-update-lock-file -c cargo test --locked --no-default-features
          nix develop --no-update-lock-file -c cargo test --locked --features local-dev
      - name: Verify attestation acceptance and rejection cases
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Reproduce the inline vault evaluator
        run: nix develop --no-update-lock-file -c bash examples/vault/build.sh --check
      - name: Reproduce the template-hash predicate
        run: nix develop --no-update-lock-file -c bash examples/templatehash/build.sh --check
      - name: Exercise the live program signing protocol
        run: |
          nix develop --no-update-lock-file -c cargo build --locked --features local-dev --bin sapio-tee --example program_oracle --example vault
          nix develop --no-update-lock-file -c bash -euo pipefail -c '
            identity=$(mktemp)
            target/debug/sapio-tee --local-dev &
            signer_pid=$!
            trap "kill $signer_pid; wait $signer_pid || true; rm -f $identity" EXIT
            for attempt in {1..50}; do
              if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
              sleep 0.1
            done
            curl --fail --silent http://127.0.0.1:8000/public-key >"$identity"
            target/debug/examples/program_oracle --address 127.0.0.1:8367 --identity "$identity" --allow-local-dev
            target/debug/examples/vault --address 127.0.0.1:8367 --identity "$identity" --allow-local-dev
          '
  eif:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reclaim runner disk for the enclave image build
        run: |
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/julia* \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore and cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Contributor-controlled pull_request code consumes this cache. PR runs
          # use a namespace outside the trusted prefix tree (nix-pr-<OS>-<arch>-*),
          # so the trusted fallback prefix can never prefix-match a PR-saved key,
          # independent of the platform's ref scoping of saved caches. Keys carry
          # the runner architecture so arm64 and x64 stores never share a key.
          primary-key: nix-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', 'Cargo.toml', 'src/**', 'enclaver.yaml') }}
          restore-prefixes-first-match: nix-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 2G
      - name: Evaluate locked flake
        run: nix flake check --no-build --no-update-lock-file
      - name: Build musl application and pinned runner
        run: nix build --no-update-lock-file .#app .#enclaver --out-link result-bin
      - name: Build measured enclave image
        run: nix build --no-update-lock-file .#eif .#enclave-kernel --out-link result-eif
      - name: Preserve actual build measurements
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          # The artifact name records the producing event so a measurement image
          # built from contributor-controlled code can never present as a
          # trusted-branch build output.
          name: sapio-tee-aarch64-eif-${{ github.event_name }}
          path: |
            result-eif/*.eif
            result-eif/pcr.json
          if-no-files-found: error

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Every workflow action is commit-SHA pinned
        run: python3 scripts/check_pinned_actions.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Audit pinned Rust dependencies against the RustSec database
        run: |
          cargo install cargo-audit --locked --version 0.22.0
          cargo audit
      - name: Audit the hash-pinned verifier closure against PyPA advisories
        run: |
          python3 -m venv /tmp/pip-audit-env
          # Pinned like every other input to this gate.
          /tmp/pip-audit-env/bin/pip install --quiet pip-audit==2.10.1
          /tmp/pip-audit-env/bin/pip-audit --require-hashes -r requirements-verifier.txt

  # x86_64 review cannot observe aarch64 emitted code (bounds checks, injected
  # metering, trap delivery). This lane runs the same locked test suite — which
  # covers exactly those paths in the WASM evaluator — on a native arm64 runner.
  tests-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore and cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-tests-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
          restore-prefixes-first-match: nix-tests-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 2G
      - name: Run the full test suite on native aarch64
        run: |
          nix develop --no-update-lock-file -c cargo check --locked --all-targets --no-default-features
          nix develop --no-update-lock-file -c cargo test --locked --no-default-features
          nix develop --no-update-lock-file -c cargo test --locked --features local-dev
